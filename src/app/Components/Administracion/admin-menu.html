<div class="admin-cards">
  <!-- Enviar Bienvenida -->
  <a routerLink="/dashboard/administracion/enviar-bienvenida" class="admin-card">
    <div class="card-icon card-icon-mail">
      <ion-icon name="mail-outline"></ion-icon>
    </div>
    <div class="card-content">
      <h3 class="card-title">Enviar Bienvenida</h3>
      <p class="card-desc">Envía email de bienvenida con credenciales y guía de uso a los maestros.</p>
    </div>

  <!-- Publicar Versión -->
  <a routerLink="/dashboard/administracion/publicar-version" class="admin-card">
    <div class="card-icon card-icon-cloud">

    <div class="card-content">
      <h3 class="card-title">Publicar Versión</h3>

    </div>
    <span class="card-arrow">→</span>
  </a>

  <!-- Auditoría -->
  <a routerLink="/dashboard/administracion/auditoria" class="admin-card">
    <div class="card-icon card-icon-doc">
      <ion-icon name="document-text-outline"></ion-icon>
    </div>
    <div class="card-content">
      <h3 class="card-title">Auditoría</h3>
      <p class="card-desc">Consulta el registro de actividades y acciones realizadas en el sistema.</p>
