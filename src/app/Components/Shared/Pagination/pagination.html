@if (totalPages() > 1) {
  <div class="pagination">
    <ion-button class="page-btn page-btn-text" [disabled]="currentPage() === 1" (click)="goFirst()" fill="outline" title="Primera página">
      «
    </ion-button>
    <ion-button class="page-btn" [disabled]="currentPage() === 1" (click)="goPrev()" fill="outline" title="Página anterior">
      <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <span class="page-indicator">Página {{ currentPage() }} de {{ totalPages() }}</span>
    <ion-button class="page-btn" [disabled]="currentPage() === totalPages()" (click)="goNext()" fill="outline" title="Página siguiente">
      <ion-icon name="chevron-forward-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button class="page-btn page-btn-text" [disabled]="currentPage() === totalPages()" (click)="goLast()" fill="outline" title="Última página">
      »
    </ion-button>
  </div>
}
